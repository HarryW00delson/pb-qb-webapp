services:
  db:
    image: postgres:17-alpine
    profiles: ['db']
    environment:
      # No compose-level ":?required" checks here — those are evaluated
      # at config-parse time for *all* services regardless of profile,
      # which would break the default `docker compose up` (no db) even
      # though this service never starts. The official postgres image
      # itself refuses to start with an unset/empty POSTGRES_PASSWORD,
      # which gives the same fail-fast behavior only when this service
      # actually runs (`docker compose --profile db up -d`).
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Bound to 127.0.0.1 only (not 0.0.0.0): lets a natively-running
    # dev server (outside Docker, per this project's local dev
    # workflow) and Prisma CLI migration commands reach Postgres from
    # the host, without exposing the database beyond localhost.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: fs-webapp-template-server
    env_file:
      # Local secrets/overrides (copy server/.env.example -> server/.env).
      # Optional: compose still starts if the file doesn't exist yet.
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      # nginx (the "client" service) is the only intended path to this
      # container in this compose topology, so it's safe to trust the
      # X-Forwarded-* headers it sets.
      TRUST_PROXY: 'true'
      # Only takes effect when the "db" profile is active (`docker
      # compose --profile db up -d`); otherwise the db service doesn't
      # exist and these are simply unused, since server/.env or the
      # app's own defaults leave DATABASE_ENABLED=false.
      #
      # DATABASE_URL is deliberately NOT built here via string
      # interpolation: a raw POSTGRES_PASSWORD containing URI-reserved
      # characters (@, :, /, #, %, etc.) would produce an invalid or
      # misparsed connection string. Instead, the server derives and
      # URL-encodes DATABASE_URL itself from these discrete parts (see
      # server/src/config/env.ts:deriveDatabaseUrl).
      DATABASE_ENABLED: ${DATABASE_ENABLED:-false}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
    # No public port mapping: the server is only reachable through the
    # client's nginx reverse proxy (see client/nginx.conf), so it can't
    # be hit directly to bypass TRUST_PROXY/rate limiting. Uncomment
    # below only for local debugging.
    # ports:
    #   - '3001:3001'
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: fs-webapp-template-client
    ports:
      - '8080:8080'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
